<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <!-- The JavaScript bridge is exposed only to this packaged 3D document.
       No remote scripts, frames, fetch/XHR, network images or form navigation. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MANO Kids 3D Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f7f8;
      touch-action: none;
      font-family: sans-serif;
    }
    #mano-stage {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #webgl-fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #163038;
      background: #f0f7f8;
    }
  </style>
</head>
<body>
  <canvas id="mano-stage"></canvas>
  <div id="webgl-fallback">
    <div>
      <h3>نمایشگر سه‌بعدی در این دستگاه فعال نیست</h3>
      <p>پشتیبانی WebGL در مرورگر داخلی غیرفعال است.</p>
    </div>
  </div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
