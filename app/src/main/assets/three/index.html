<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مانو کید • استودیو سه‌بعدی</title>
  <link rel="stylesheet" href="./typography.css" />
  <link rel="stylesheet" href="./frosted-banners.css" />
  <style>
    :root {
      --bg-top: #f3fbff;
      --bg-bottom: #f8fcfb;
      --halo-a: rgba(98, 206, 194, 0.10);
      --halo-b: rgba(114, 184, 232, 0.08);
      --hud-ink: var(--ink-primary);
      --card-muted: var(--ink-secondary);
      --accent: #229c90;
    }

    html.dark-theme {
      --bg-top: #08191f;
      --bg-bottom: #0d242d;
      --halo-a: rgba(108, 224, 214, 0.09);
      --halo-b: rgba(102, 178, 238, 0.08);
      --hud-ink: var(--ink-primary);
      --card-muted: var(--ink-secondary);
      --accent: #6fe3d6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      touch-action: none;
      transition: background 0.35s ease;
    }

    .stage-backdrop-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, var(--halo-a) 0%, transparent 48%),
        radial-gradient(circle at 82% 76%, var(--halo-b) 0%, transparent 50%);
      z-index: 0;
    }

    #mano-stage {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .stage-hud-pill {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      z-index: 2;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      color: var(--hud-ink);
      white-space: nowrap;
    }

    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 4px rgba(108, 224, 214, 0.45);
      flex-shrink: 0;
    }

    #stage-loader {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--hud-ink);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #stage-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #webgl-fallback {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    .fallback-card {
      max-width: 340px;
      width: 100%;
      padding: 22px 20px;
      color: var(--hud-ink);
    }

    .fallback-card .type-card-title {
      margin: 0 0 8px;
    }

    .fallback-card .type-body-supporting {
      margin: 0;
      color: var(--card-muted);
    }
  </style>
</head>
<body>
  <div class="stage-backdrop-glow frosted-ambient-halo" aria-hidden="true"></div>
  <canvas id="mano-stage" aria-label="صحنه تعاملی سه‌بعدی مانو کید"></canvas>

  <div class="stage-hud-pill frosted-banner frosted-banner--pill frosted-float--centered frosted-float--gentle type-caption-medium" aria-hidden="true">
    <span class="hud-dot"></span>
    <span>چرخش با لمس • بزرگ‌نمایی • ضربه روی مانو</span>
  </div>

  <div id="stage-loader" aria-label="در حال آماده‌سازی صحنه سه‌بعدی">
    <div class="turquoise-progress-ring" role="progressbar" aria-label="در حال بارگذاری"></div>
    <span class="type-compact-title">در حال آماده‌سازی استودیو مانو کید...</span>
  </div>

  <div id="webgl-fallback" role="alert">
    <div class="fallback-card frosted-banner frosted-banner--card frosted-float frosted-float--slow align-clinical-center">
      <h3 class="type-card-title">نمایشگر سه‌بعدی در این دستگاه فعال نیست</h3>
      <p class="type-body-supporting">پشتیبانی WebGL در مرورگر داخلی غیرفعال است؛ راهنماها و نمودارهای دوبعدی برنامه همچنان کاملاً در دسترس هستند.</p>
    </div>
  </div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
