name: MANO safety checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore emulator security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore emulator and test dependencies
        run: npm install --no-save @firebase/rules-unit-testing firebase firebase-tools
      - name: Execute Firestore rules regression tests
        run: npx firebase emulators:exec --project demo-mano-kids --only firestore "node --test firestore.test.js"

  android-build-and-tests:
    name: Android debug build and Robolectric
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner provides Android SDK command-line tools.
      # Avoid setup-android action's obsolete 'sdkmanager tools' package request.
      - name: Install required Android SDK platforms
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate temporary CI debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build and run Android unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
