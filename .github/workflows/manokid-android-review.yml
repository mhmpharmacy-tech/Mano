name: Manokid Android and form checks

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/manokid-android-review.yml"
  pull_request:
    paths:
      - "app/**"
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/manokid-android-review.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: functions

  android-build-and-tests:
    name: Android debug build and Robolectric
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 for Android 16 Robolectric
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu runner provides Android SDK command-line tools.
      # Avoid setup-android action's obsolete 'sdkmanager tools' package request.
      - name: Install required Android SDK platforms
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate temporary CI debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase emulator CLI
        run: npm install --no-save firebase-tools
      - name: Build Android debug app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Run full Robolectric and Firebase integration test suite
        run: npx firebase emulators:exec --project demo-no-project --only firestore,auth "gradle :app:testDebugUnitTest --no-daemon --stacktrace"
      - name: Upload test results for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-robolectric-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
