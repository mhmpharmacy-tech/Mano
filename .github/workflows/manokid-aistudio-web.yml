name: MANO web validation

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "preview/**"
      - "public/**"
      - "package*.json"
      - "server.ts"
      - "server/**"
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.web*.json"
      - "scripts/*web*"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".env.example"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "index.html"
      - "preview/**"
      - "public/**"
      - "package*.json"
      - "server.ts"
      - "server/**"
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.web*.json"
      - "scripts/*web*"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".env.example"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          MANO_GATEWAY_ACCESS_TOKEN: ci-server-only-token-must-never-reach-browser-8d85a1d0
      - run: npm run verify:web-build
        env:
          MANO_GATEWAY_ACCESS_TOKEN: ci-server-only-token-must-never-reach-browser-8d85a1d0
      - name: Upload internal review build
        uses: actions/upload-artifact@v4
        with:
          name: mano-web-internal-review
          path: dist/
          if-no-files-found: error
          retention-days: 7

  chromium-ui:
    name: Browser safety (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: static-and-security
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install locked browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
        env:
          MANO_GATEWAY_ACCESS_TOKEN: ci-server-only-token-must-never-reach-browser-8d85a1d0
      - name: Exercise the production server and browser safety flows
        run: node tests/browser.mjs
        env:
          MANO_BROWSER: ${{ matrix.browser }}
      - name: Upload mobile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mano-web-mobile-screenshots-${{ matrix.browser }}
          path: web-artifacts/
          if-no-files-found: ignore
          retention-days: 7

