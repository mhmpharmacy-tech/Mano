name: MANO Kids web preview checks
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
permissions:
  contents: read
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check web/logic.js
          node --check web/app.js
          node --check web/staff-demo.js
      - name: Behavior and asset checks
        run: node --test web/tests/smoke.test.cjs
