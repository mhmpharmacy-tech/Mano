name: MANO Brand Integrity
on:
  push:
    branches: [feature/mano-brand-engine]
permissions:
  contents: read
jobs:
  brand-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test web/brand-integrity.test.cjs
