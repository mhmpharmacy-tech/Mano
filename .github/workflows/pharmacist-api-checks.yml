name: MANO pharmacist API contract tests
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.test.js'
      - 'firestore.rules'
      - '.github/workflows/pharmacist-api-checks.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.test.js'
      - 'firestore.rules'
      - '.github/workflows/pharmacist-api-checks.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  policy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --prefix functions --no-audit --no-fund --no-package-lock
      - name: Syntax and pure-policy tests
        run: |
          npm run lint --prefix functions
          npm test --prefix functions

  firestore-tenant-boundary:
    name: Firestore direct-access denial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator tooling
        run: npm install --no-save @firebase/rules-unit-testing firebase firebase-tools
      - name: Verify direct client access is denied for clinical cases, audit and triage
        run: npx firebase emulators:exec --project demo-mano-kids --only firestore "node --test firestore.test.js"
