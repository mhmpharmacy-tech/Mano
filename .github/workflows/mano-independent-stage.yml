name: MANO independent PostgreSQL staging
on:
  pull_request:
    paths:
      - 'independent-backend/**'
      - '.github/workflows/mano-independent-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-synthetic-only
          POSTGRES_DB: mano_stage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: independent-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test unit.test.mjs migration.test.mjs backup.test.mjs reconcile.test.mjs
      - run: npm run test:integration
        env:
          MANO_TEST_ADMIN_URL: postgresql://postgres:ci-admin-synthetic-only@127.0.0.1:5432/mano_stage
      - uses: actions/upload-artifact@v4
        with:
          name: independent-stage-lockfile-review
          path: independent-backend/package-lock.json
          if-no-files-found: error
          retention-days: 7
